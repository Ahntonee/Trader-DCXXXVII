services:
  - type: web
    name: apex-terminal
    env: node
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # SQLite must live on the persistent disk, NOT in the source tree.
      - key: DB_PATH
        value: /var/data/apex.db
      # Required to use reset / clear-journal / backtest. Without it those
      # endpoints return 503 in production (fail closed).
      - key: ADMIN_TOKEN
        generateValue: true
      # Comma-separated extra origins allowed to open the WebSocket (optional).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TWELVE_DATA_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: apex-data
      mountPath: /var/data
      sizeGB: 1
